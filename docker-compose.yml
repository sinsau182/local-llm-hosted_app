version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platform-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Backend FEATURE_* toggles come from the root master .env (runtime).
    env_file:
      - .env
    environment:
      - LLAMA_URL=http://host.docker.internal:4001
      - LLAMA_TIMEOUT_SECONDS=600
      - COMFYUI_URL=http://host.docker.internal:8188
      # Audio sidecars (CPU, always-on) — Whisper STT + Kokoro TTS. Reached on
      # the host like llama-server/ComfyUI; both speak the OpenAI audio API.
      - WHISPER_URL=http://host.docker.internal:9001
      - KOKORO_URL=http://host.docker.internal:9002
      - LITELLM_API_KEY=sk-f4fe27901e83c3ebf669625d9b291d27dc4908b2a671bb91f3bdda42e905d2b3
      - CHROMADB_HOST=host.docker.internal
      - CHROMADB_PORT=8010
      - DATABASE_URL=postgresql+psycopg://platform_user:platform_password@postgres:5432/platform
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=/data/media
      # Object storage for streaming generated assets back to the browser.
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=platform
      - MINIO_SECRET_KEY=platform_secret
      - MINIO_BUCKET=platform-media
    extra_hosts:
      - "host.docker.internal:172.17.1.1"
    volumes:
      - ./data/media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # §5/§9 — single media worker. Drains the Redis FIFO one job at a time so
  # image/video generations are serialized (no colliding GPU memory spikes).
  media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platform-media-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.media_worker"]
    env_file:
      - .env
    environment:
      - COMFYUI_URL=http://host.docker.internal:8188
      - REDIS_URL=redis://redis:6379/0
      - MEDIA_ROOT=/data/media
      # Flip to true once ai-server/model_loader.py is running to enable the
      # video-exclusive mode switch + coder serial lock.
      - MEDIA_ORCHESTRATOR_ENABLED=${MEDIA_ORCHESTRATOR_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:172.17.1.1"
    volumes:
      - ./data/media:/data/media
    depends_on:
      redis:
        condition: service_started

  # Ingests ComfyUI outputs (tagged user/<uid>/…) into the media bucket +
  # Postgres so each user gets a browsable history of what they created.
  media-ingester:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: platform-media-ingester
    restart: unless-stopped
    command: ["python", "-m", "app.workers.ingest_worker"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://platform_user:platform_password@postgres:5432/platform
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=platform
      - MINIO_SECRET_KEY=platform_secret
      - MINIO_BUCKET=platform-media
      - COMFYUI_OUTPUT_DIR=/data/comfyui/output
    volumes:
      # ComfyUI's output dir on the host (read-only — ComfyUI owns the files).
      - /data/comfyui/output:/data/comfyui/output:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Frontend NEXT_PUBLIC_* toggles from the root master .env are baked in at
      # build time. Change them in .env then: docker compose up -d --build frontend
      args:
        NEXT_PUBLIC_FEATURE_CHAT_PAGE: ${NEXT_PUBLIC_FEATURE_CHAT_PAGE:-false}
        NEXT_PUBLIC_FEATURE_DASHBOARD_TAB: ${NEXT_PUBLIC_FEATURE_DASHBOARD_TAB:-false}
        NEXT_PUBLIC_FEATURE_AUDIO_PAGE: ${NEXT_PUBLIC_FEATURE_AUDIO_PAGE:-true}
        NEXT_PUBLIC_FEATURE_LIBRECHAT: ${NEXT_PUBLIC_FEATURE_LIBRECHAT:-true}
        NEXT_PUBLIC_COMFYUI_URL: ${NEXT_PUBLIC_COMFYUI_URL:-}
    container_name: platform-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: pgvector/pgvector:pg16
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=platform
      - POSTGRES_USER=platform_user
      - POSTGRES_PASSWORD=platform_password
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: platform-redis
    restart: unless-stopped
    # Published on loopback so the host orchestrator (ai-server/model_loader.py)
    # shares the same queue/orchestration state as the api + worker containers.
    # Host 6379 is taken by a system redis-server, so map to 6380 — point the
    # orchestrator at it with REDIS_URL=redis://127.0.0.1:6380/0.
    ports:
      - "127.0.0.1:6380:6379"

  # Object storage for generated media. Kept internal — the API streams objects
  # back to the browser, so only the admin console is exposed (loopback only).
  minio:
    image: minio/minio:latest
    container_name: platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=platform
      - MINIO_ROOT_PASSWORD=platform_secret
    ports:
      - "127.0.0.1:9001:9001"   # web console (loopback only)
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  minio_data:
